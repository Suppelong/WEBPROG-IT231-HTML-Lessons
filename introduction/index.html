<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Resume</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">MyName</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#gallery">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="#guestbook">Guestbook</a></li>
                    <li class="nav-item"><a class="nav-link" href="resources.html">Resources</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="bg-light py-5 text-center" id="about">
        <div class="container">
            <h1>Hello, I'm [Your Name]</h1>
            <p class="lead">Web Developer | Designer | Student</p>
        </div>
    </header>

    <div id="app">
        
        <section id="gallery" class="py-5">
            <div class="container">
                <h2 class="text-center mb-4">My Picture Gallery</h2>
                <image-gallery></image-gallery> 
            </div>
        </section>

        <section id="guestbook" class="py-5 bg-light">
            <div class="container">
                <h2 class="text-center mb-4">Guestbook Survey</h2>
                <guestbook-form></guestbook-form>
            </div>
        </section>

    </div>

    <footer class="bg-dark text-white text-center py-3">
        <p>&copy; 2026 MyName. All Rights Reserved.</p>
        <p><a href="resources.html" class="text-white">View Resource Documentation</a></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const { createApp } = Vue

        const app = createApp({
            // Main app logic can go here
        })

        // 1. Define Gallery Component
        app.component('image-gallery', {
            template: `
                <div class="row">
                    <div class="col-md-4 mb-3" v-for="(img, index) in images" :key="index">
                        <div class="card">
                            <img :src="img.src" class="card-img-top" :alt="img.alt">
                            <div class="card-body">
                                <p class="card-text">{{ img.caption }}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            data() {
                return {
                    images: [
                        { src: 'images/sample1.jpg', alt: 'Project 1', caption: 'My First Project' },
                        { src: 'images/sample2.jpg', alt: 'Project 2', caption: 'Web Design Work' },
                        // Add more images here
                    ]
                }
            }
        })

        // 2. Define Guestbook Component
        app.component('guestbook-form', {
            template: `
                <form @submit.prevent="submitForm" class="w-50 mx-auto">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" v-model="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea v-model="message" class="form-control" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Sign Guestbook</button>
                    <div v-if="submitted" class="alert alert-success mt-3">Thanks for signing, {{ name }}!</div>
                </form>
            `,
            data() {
                return {
                    name: '',
                    message: '',
                    submitted: false
                }
            },
            methods: {
                submitForm() {
                    this.submitted = true;
                    // Here you would usually send data to a backend
                }
            }
        })

        app.mount('#app')
    </script>
</body>
</html>
